# Lab broker configuration. Single node; this proves no high availability.
listeners.tcp.default = 5672
management.tcp.port = 15672

# Fail fast instead of silently blocking publishers for a long time in the lab.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 250MB

# The lab declares its own durable topology from the application.
# No policies, no TTL, no max-length, no automatic DLX.
log.console = true
log.console.level = info
